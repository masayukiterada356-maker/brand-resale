<!doctype html><meta charset="utf-8"><title>練習用：出品中・編集</title>
<main id="m"></main>
<script>
// 3つのフリマの「出品中の一覧」「商品ページ」「編集画面」をまねた練習用の画面（価格はこのブラウザの中だけに保存）
const H = location.host, P = location.pathname + location.search;
const DATA = {
  'jp.mercari.com': [
    ['m11111111111', 'TIFFANY オープンハート ネックレス 750PG 1.4g 箱', 85000],
    ['m22222222222', 'LOEWE フラメンコ アナグラム ネイビー ショルダーバッグ 061707', 140000],
    ['m33333333333', 'ティファニー ネックレス オープンハート', 12000],
  ],
  'fril.jp': [['a1b2c3d4e5f6a7b8c9d0', 'LOEWE フラメンコ アナグラム ネイビー 061707 ショルダー', 139000]],
  'item.fril.jp': [],
  'paypayfleamarket.yahoo.co.jp': [['z100000001', 'TIFFANY オープンハート ネックレス 750 41cm 3g', 97000]],
  'paypayfleamarket-sec.yahoo.co.jp': [],
};
const KEY = 'fake-prices';
const prices = JSON.parse(localStorage.getItem(KEY) || '{}');
const stopped = JSON.parse(localStorage.getItem('fake-stopped') || '[]');
const price = (id, d) => prices[id] ?? d;
const link = { 'jp.mercari.com': (id) => `/item/${id}`, 'fril.jp': (id) => `https://item.fril.jp/${id}`, 'paypayfleamarket.yahoo.co.jp': (id) => `/item/${id}` };
const m = document.getElementById('m');
const all = Object.values(DATA).flat();
if (/\/mypage\/listings|^\/sell$|\/my\/selling/.test(P)) {
  m.innerHTML = '<h1>出品中</h1>' + (DATA[H] || []).filter(([id]) => !stopped.includes(id)).map(([id, t, p]) => `<div class="card"><a href="${link[H](id)}"><div>${t}</div><div>¥${price(id, p).toLocaleString()}</div></a></div>`).join('');
} else if (/\/sell\/edit\/|\/item\/[^/]+\/edit|\/item\/edit/.test(P)) {
  const id = (/(m\d+|[0-9a-f]{16,}|z\d+)/.exec(P) || [])[1];
  const row = all.find((r) => r[0] === id);
  const name = H === 'jp.mercari.com' ? 'name="price"' : H === 'fril.jp' ? 'name="sellPrice"' : 'type="tel"';
  m.innerHTML = `<h1>商品の編集 ${id}</h1><label>販売価格<input ${name} id="pr" value="${price(id, row[2])}"></label>
    <button id="del">削除する</button> <button id="stop">${H === 'fril.jp' ? '下書きに戻す' : H === 'jp.mercari.com' ? '出品を一時停止する' : '出品を停止する'}</button> <button id="save">変更する</button>`;
  del.onclick = () => fetch('/__save', { method: 'POST', body: JSON.stringify({ ERROR: '削除が押された' }) });
  stop.onclick = async () => { stopped.push(id); localStorage.setItem('fake-stopped', JSON.stringify(stopped));
    await fetch('/__save', { method: 'POST', body: JSON.stringify({ stopped: id }) }); m.innerHTML = '<p>止めました</p>'; };
  save.onclick = async () => { prices[id] = Number(pr.value); localStorage.setItem(KEY, JSON.stringify(prices));
    await fetch('/__save', { method: 'POST', body: JSON.stringify({ id, price: Number(pr.value) }) }); m.innerHTML = '<p>変更しました</p>'; };
} else if (/\/item\/z\d+/.test(P)) {
  const id = /(z\d+)/.exec(P)[1];
  m.innerHTML = `<h1>商品ページ ${id}</h1><a href="https://paypayfleamarket-sec.yahoo.co.jp/item/edit?itemId=${id}">商品の編集</a>`;
} else {
  m.innerHTML = '<p>（練習用）このページはありません</p>';
}
</script>
